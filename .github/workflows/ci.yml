name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (JVM core + app)
        run: ./gradlew :core:routing:test :core:testing:test :app:testDebugUnitTest -Pleylink.warningsAsErrors=true
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
